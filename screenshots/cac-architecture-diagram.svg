<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#0c1324"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#651fff"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00c853"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="940" height="560" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g stroke="#162238" stroke-width="1" opacity="0.4">
    <line x1="0" y1="70" x2="940" y2="70" />
    <line x1="0" y1="140" x2="940" y2="140" />
    <line x1="0" y1="210" x2="940" y2="210" />
    <line x1="0" y1="280" x2="940" y2="280" />
    <line x1="0" y1="350" x2="940" y2="350" />
    <line x1="0" y1="420" x2="940" y2="420" />
    <line x1="0" y1="490" x2="940" y2="490" />
    <line x1="160" y1="0" x2="160" y2="560" />
    <line x1="320" y1="0" x2="320" y2="560" />
    <line x1="480" y1="0" x2="480" y2="560" />
    <line x1="640" y1="0" x2="640" y2="560" />
    <line x1="800" y1="0" x2="800" y2="560" />
  </g>

  <!-- Title Banner -->
  <rect x="30" y="20" width="880" height="60" rx="8" fill="url(#cardGrad)" stroke="#1e2c47" stroke-width="1.5" />
  <circle cx="65" cy="50" r="18" fill="url(#accentCyan)" />
  <text x="65" y="56" font-family="-apple-system, sans-serif" font-size="18" font-weight="900" fill="#000" text-anchor="middle">🛡️</text>
  <text x="100" y="44" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="0.5">CACForge Pro | Space Authentication Credentials Architecture</text>
  <text x="100" y="64" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#00e5ff" letter-spacing="1">NORMATIVE BASELINE: CCSDS 357.0-B-1 (BLUE BOOK) &amp; CCSDS 352.0-B-2</text>
  <rect x="740" y="35" width="150" height="30" rx="6" fill="#00e676" fill-opacity="0.15" stroke="#00e676" stroke-width="1" />
  <text x="815" y="54" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#00e676" text-anchor="middle">23/23 ICS CERTIFIED</text>

  <!-- Column 1: X.509 Space Profile PKI -->
  <rect x="30" y="100" width="425" height="310" rx="8" fill="url(#cardGrad)" stroke="#1e2c47" stroke-width="1.5" />
  <rect x="30" y="100" width="425" height="38" rx="8" fill="#15243f" />
  <text x="45" y="124" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#00e5ff">X.509 v3 SPACE PROFILE (PKI)</text>
  <text x="390" y="124" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#90a4cb">RFC 5280 / §3.1</text>

  <!-- TBS Blocks -->
  <g transform="translate(45, 150)">
    <rect x="0" y="0" width="395" height="32" rx="4" fill="#0b1220" stroke="#00e5ff" stroke-width="1" stroke-dasharray="3,3" />
    <text x="15" y="20" font-family="monospace" font-size="11" fill="#ffffff">Version: [0] INTEGER 2 (X.509 v3)</text>

    <rect x="0" y="38" width="395" height="32" rx="4" fill="#0b1220" stroke="#2979ff" stroke-width="1" />
    <text x="15" y="58" font-family="monospace" font-size="11" fill="#a4c5eb">Serial Number: 64-128 bit Unique Positive Int</text>

    <rect x="0" y="76" width="395" height="32" rx="4" fill="#0b1220" stroke="#2979ff" stroke-width="1" />
    <text x="15" y="96" font-family="monospace" font-size="11" fill="#a4c5eb">Signature Alg: SHA256withRSA (1.2.840.113549.1.1.11)</text>

    <rect x="0" y="114" width="395" height="32" rx="4" fill="#0b1220" stroke="#2979ff" stroke-width="1" />
    <text x="15" y="134" font-family="monospace" font-size="11" fill="#a4c5eb">Issuer / Subject: RDNSequence (C, O, OU, CN)</text>

    <rect x="0" y="152" width="395" height="32" rx="4" fill="#0b1220" stroke="#00e676" stroke-width="1" />
    <text x="15" y="172" font-family="monospace" font-size="11" fill="#00e676">Validity: GeneralizedTime (YYYYMMDDHHMMSSZ)</text>

    <rect x="0" y="190" width="395" height="32" rx="4" fill="#0b1220" stroke="#7c4dff" stroke-width="1" />
    <text x="15" y="210" font-family="monospace" font-size="11" fill="#d1c4e9">Extensions: BasicConstraints, KeyUsage, SAN, CRL</text>

    <rect x="0" y="228" width="395" height="24" rx="4" fill="#1b2a47" />
    <text x="15" y="244" font-family="monospace" font-size="10" fill="#80d8ff">Export Syntax: PKCS#12 (RFC 7292) Personal Info Exchange</text>
  </g>

  <!-- Column 2: Protected Simple Auth -->
  <rect x="485" y="100" width="425" height="310" rx="8" fill="url(#cardGrad)" stroke="#1e2c47" stroke-width="1.5" />
  <rect x="485" y="100" width="425" height="38" rx="8" fill="#15243f" />
  <text x="500" y="124" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffb300">PROTECTED SIMPLE AUTHENTICATION</text>
  <text x="815" y="124" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#90a4cb">ISO 9594-8 / §3.2</text>

  <!-- PSA Flow Blocks -->
  <g transform="translate(500, 150)">
    <rect x="0" y="0" width="185" height="55" rx="6" fill="#0b1220" stroke="#ffb300" stroke-width="1" />
    <text x="12" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffb300">DUA (Spacecraft)</text>
    <text x="12" y="40" font-family="monospace" font-size="10" fill="#a4c5eb">Subscriber DN + Key</text>

    <rect x="210" y="0" width="185" height="55" rx="6" fill="#0b1220" stroke="#00e5ff" stroke-width="1" />
    <text x="222" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#00e5ff">DSA (Ground Station)</text>
    <text x="222" y="40" font-family="monospace" font-size="10" fill="#a4c5eb">Bilateral Verifier</text>

    <!-- Wire Arrow -->
    <line x1="90" y1="65" x2="90" y2="90" stroke="#ffb300" stroke-width="2" />
    <line x1="90" y1="90" x2="300" y2="90" stroke="#ffb300" stroke-width="2" />
    <line x1="300" y1="90" x2="300" y2="65" stroke="#ffb300" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="0" y="105" width="395" height="40" rx="4" fill="#091424" stroke="#ffb300" stroke-width="1" />
    <text x="12" y="124" font-family="monospace" font-size="10" fill="#ffffff">One-Way Hash: SHA-256(DN || Pwd || Nonce || T_CCS)</text>
    <text x="12" y="138" font-family="monospace" font-size="9" fill="#ffb300">T_CCS Formatted per CCSDS 301.0-B-4 (YYYY-MM-DDTHH:MM:SSZ)</text>

    <rect x="0" y="155" width="395" height="97" rx="4" fill="#0b1220" stroke="#1e2c47" stroke-width="1" />
    <text x="12" y="175" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#00e676">DSA Telemetry &amp; Anti-Replay Guard:</text>
    <text x="12" y="195" font-family="monospace" font-size="10" fill="#a4c5eb">1. Nonce Cache: Checks seen 128-bit random challenges</text>
    <text x="12" y="215" font-family="monospace" font-size="10" fill="#a4c5eb">2. Latency Bound: |T_recv - T_CCS| &lt;= Delta_T_drift (300s)</text>
    <text x="12" y="235" font-family="monospace" font-size="10" fill="#a4c5eb">3. Hash Verification: Recomputes H_exp &amp; compares token</text>
  </g>

  <!-- Bottom Row: 23-Point ICS Normative Auditor Engine -->
  <rect x="30" y="425" width="880" height="115" rx="8" fill="url(#cardGrad)" stroke="#1e2c47" stroke-width="1.5" />
  <rect x="30" y="425" width="880" height="30" rx="8" fill="#15243f" />
  <text x="45" y="445" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#00e676">CCSDS 357.0-B-1 ANNEX A IMPLEMENTATION CONFORMANCE STATEMENT (ICS) AUDITOR</text>
  <text x="810" y="445" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#90a4cb">23 REQUIREMENTS</text>

  <g transform="translate(45, 465)">
    <rect x="0" y="0" width="135" height="60" rx="4" fill="#091424" stroke="#00e676" stroke-width="1" />
    <text x="10" y="18" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#00e676">Items 1-4: Core DER</text>
    <text x="10" y="34" font-family="monospace" font-size="9" fill="#a4c5eb">ASN.1, DER Canonical,</text>
    <text x="10" y="48" font-family="monospace" font-size="9" fill="#a4c5eb">X.509 v3, TBSCert</text>

    <rect x="145" y="0" width="135" height="60" rx="4" fill="#091424" stroke="#00e676" stroke-width="1" />
    <text x="10" y="18" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#00e676">Items 5-8: Identity</text>
    <text x="10" y="34" font-family="monospace" font-size="9" fill="#a4c5eb">Version [0] INT 2,</text>
    <text x="10" y="48" font-family="monospace" font-size="9" fill="#a4c5eb">Serial, SigAlg, Issuer</text>

    <rect x="290" y="0" width="135" height="60" rx="4" fill="#091424" stroke="#00e676" stroke-width="1" />
    <text x="10" y="18" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#00e676">Items 9-13: Keys</text>
    <text x="10" y="34" font-family="monospace" font-size="9" fill="#a4c5eb">Validity, Subject DN,</text>
    <text x="10" y="48" font-family="monospace" font-size="9" fill="#a4c5eb">SPKI Alg, Public Key</text>

    <rect x="435" y="0" width="135" height="60" rx="4" fill="#091424" stroke="#00e676" stroke-width="1" />
    <text x="10" y="18" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#00e676">Items 14-17: Time</text>
    <text x="10" y="34" font-family="monospace" font-size="9" fill="#a4c5eb">UTC Reference,</text>
    <text x="10" y="48" font-family="monospace" font-size="9" fill="#a4c5eb">GeneralizedTime CCS</text>

    <rect x="580" y="0" width="135" height="60" rx="4" fill="#091424" stroke="#00e676" stroke-width="1" />
    <text x="10" y="18" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#00e676">Items 18-21: Exts</text>
    <text x="10" y="34" font-family="monospace" font-size="9" fill="#a4c5eb">OIDs, PolicyMap,</text>
    <text x="10" y="48" font-family="monospace" font-size="9" fill="#a4c5eb">SAN DNS, CRL URI</text>

    <rect x="725" y="0" width="125" height="60" rx="4" fill="#091424" stroke="#00e676" stroke-width="1" />
    <text x="10" y="18" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#00e676">Items 22-23: Sig</text>
    <text x="10" y="34" font-family="monospace" font-size="9" fill="#a4c5eb">sigAlgorithm &amp;</text>
    <text x="10" y="48" font-family="monospace" font-size="9" fill="#a4c5eb">signatureValue</text>
  </g>
</svg>
